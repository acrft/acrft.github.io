<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>document.documentElement.classList.add("auth-loading");</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130f">
<meta name="color-scheme" content="dark">
<meta name="description" content="AlamChat - منصة دردشة للتواصل ومشاركة الرسائل والصور بسهولة.">
<title>AlamChat | علم شات</title>
<link rel="icon" href="https://acrft.github.io/images/achat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="https://image2url.com/r2/default/images/1775525811581-9dc91a60-c309-4cdd-ad97-7e786eb938b5.png">
<link rel="stylesheet" href="achat.css">
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script defer src="achat.js"></script>
</head>
<body>
<div class="app-shell">

<section id="login" class="login-screen" aria-label="تسجيل الدخول">
<div class="login-card card">
<div class="brand">
<img class="logo" src="https://acrft.github.io/images/achat.png" alt="شعار AlamChat" width="88" height="88">
<div class="brand-name">Alam<span>Chat</span></div>
<div class="brand-tagline">عالمك، محادثاتك، في مكان واحد</div>
</div>
<div class="login-divider"><span></span><i></i><span></span></div>
<h1>أهلاً بيك في AlamChat</h1>
<p class="login-description">سجّل دخولك وابدأ التواصل ومشاركة الرسائل والصور بسهولة.</p>
<button id="loginBtn" class="btn" type="button">
<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z" transform="translate(0 4)"/>
<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.75 7.18l7.73 6C44.42 37.98 46.98 31.92 46.98 24.55Z"/>
<path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19Z" transform="translate(1 0)"/>
<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z" transform="translate(0 -2)"/>
</svg>
<span>تسجيل الدخول باستخدام Google</span>
</button>
<button id="githubLoginBtn" class="btn github-btn" type="button">
<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.67-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.77 1.15 2.99 0 4.29-2.61 5.23-5.1 5.51.4.35.75 1.03.75 2.08V22c0 .29.2.63.76.52A11.1 11.1 0 0 0 12 .9Z"/></svg>
<span>تسجيل الدخول باستخدام GitHub</span>
</button>
<div class="security-note"><span class="security-dot"></span> تسجيل دخول آمن باستخدام حساب Google</div>
</div>
</section>

<section id="chat" class="chat-screen" aria-label="محادثات AlamChat">

<header class="header">
<div id="userInfo" class="user" aria-label="معلومات المستخدم"></div>
<button id="logoutBtn" class="logout-btn" type="button" title="تسجيل الخروج" aria-label="تسجيل الخروج">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M10 17l5-5-5-5"/>
<path d="M15 12H3"/>
<path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
</svg>
</button>
</header>

<main id="messages" class="messages" aria-label="الرسائل" aria-live="polite" aria-relevant="additions"></main>

<footer class="chat-footer">
<form class="input" id="messageForm" autocomplete="off">
<button id="siteBtn" class="send site-button" type="button" title="زيارة موقع AlamCraft" aria-label="زيارة موقع AlamCraft">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="12" cy="12" r="10"/>
<path d="M2 12h20"/>
<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/>
</svg>
</button>

<button id="imageBtn" class="send image-button" type="button" title="إرسال صورة" aria-label="إرسال صورة">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="3" y="3" width="18" height="18" rx="3"/>
<circle cx="8.5" cy="8.5" r="1.5"/>
<path d="m21 15-5-5L5 21"/>
</svg>
</button>

<input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<textarea id="msgInput" name="message" rows="1" maxlength="500" placeholder="اكتب رسالتك هنا..." enterkeyhint="send"></textarea>

<button id="sendBtn" class="send submit-button" type="submit" title="إرسال الرسالة" aria-label="إرسال الرسالة">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="m22 2-7 20-4-9-9-4Z"/>
<path d="M22 2 11 13"/>
</svg>
</button>
</form>
<div class="footer-caption">تواصل باحترام، وخلّي المحادثة دايمًا إيجابية 💚</div>
</footer>

</section>
</div>
</body>
</html>
