<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130f">
<meta name="color-scheme" content="dark">
<meta name="description" content="AlamChat - منصة دردشة للتواصل ومشاركة الرسائل والصور بسهولة.">
<title>AlamChat | علم شات</title>
<link rel="icon" href="https://acrft.github.io/images/achat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"></noscript>
<link rel="stylesheet" href="achat.css">
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script defer src="achat.js"></script>
</head>
<body>
<div id="toast"></div>

<main id="login" class="center" hidden>
  <div class="card">
    <img class="logo" src="https://acrft.github.io/images/achat.png" alt="AlamChat" width="84" height="84" decoding="async">
    <h1>Alam<span>Chat</span></h1>
    <p class="muted">عالمك، محادثاتك، في مكان واحد</p>
    <button id="googleBtn" class="btn">تسجيل الدخول باستخدام Google</button>
    <button id="githubBtn" class="btn dark">تسجيل الدخول باستخدام GitHub</button>
    <div class="or">أو برقم الهاتف</div>
    <input id="phoneIn" type="tel" dir="ltr" placeholder="+20123456789 (مع كود الدولة)">
    <button id="phoneBtn" class="btn">إرسال الكود عبر تلجرام</button>
    <div id="codeBox" hidden>
      <p class="muted small">افتح بوت تلجرام، شارك رقمك، وهيوصلك الكود هناك.</p>
      <input id="codeIn" inputmode="numeric" maxlength="6" dir="ltr" placeholder="الكود (6 أرقام)">
      <button id="codeBtn" class="btn">تأكيد الكود</button>
    </div>
  </div>
</main>

<main id="plink" class="center" hidden>
  <div class="card">
    <h2>ربط رقم الهاتف</h2>
    <p class="muted small">اختياري. هيوصلك كود التأكيد على بوت تلجرام.</p>
    <input id="plPhone" type="tel" dir="ltr" placeholder="+20123456789 (مع كود الدولة)">
    <button id="plBtn" class="btn">إرسال الكود عبر تلجرام</button>
    <div id="plBox" hidden>
      <input id="plCode" inputmode="numeric" maxlength="6" dir="ltr" placeholder="الكود (6 أرقام)">
      <button id="plCodeBtn" class="btn">تأكيد وربط الرقم</button>
    </div>
    <button id="plOut" class="btn ghost">رجوع</button>
  </div>
</main>

<main id="setup" class="center" hidden>
  <div class="card">
    <h2>أنشئ ملفك الشخصي</h2>
    <input id="suName" maxlength="30" placeholder="الاسم">
    <input id="suUser" maxlength="20" dir="ltr" placeholder="username (حروف إنجليزي وأرقام و _)">
    <p class="muted small">اليوزر نيم فريد ولا يمكن تغييره لاحقًا.</p>
    <button id="suBtn" class="btn">ابدأ</button>
    <button id="suOut" class="btn ghost">خروج</button>
  </div>
</main>

<section id="app" class="app" hidden>
  <aside class="side">
    <header class="bar">
      <img id="meAv" class="av" alt="">
      <b>AlamChat</b>
      <button id="profBtn" class="icon" title="البروفايل">⚙️</button>
    </header>
    <div class="search">
      <input id="findIn" dir="ltr" placeholder="ابحث بـ @username أو رقم هاتف">
    </div>
    <div id="chatList" class="list"></div>
  </aside>
  <main class="pane">
    <div id="empty" class="center muted">اختر محادثة أو ابحث عن يوزر لبدء محادثة جديدة 💬</div>
    <div id="room" hidden>
      <header class="bar">
        <button id="backBtn" class="icon back">→</button>
        <img id="peerAv" class="av" alt="">
        <div><b id="peerName"></b><div id="peerUser" class="muted small" dir="ltr"></div></div>
      </header>
      <div id="msgs" class="msgs"></div>
      <form id="form" class="input" autocomplete="off">
        <button id="imgBtn" type="button" class="icon">🖼️</button>
        <input id="imgIn" type="file" accept="image/*" hidden>
        <input id="msgIn" maxlength="500" placeholder="اكتب رسالتك...">
        <button class="icon send" title="إرسال">➤</button>
      </form>
    </div>
  </main>
</section>

<div id="modal" class="center modal" hidden>
  <div class="card">
    <h2>البروفايل</h2>
    <img id="pAv" class="logo round" alt="">
    <button id="pPhoto" class="btn ghost">تغيير الصورة</button>
    <input id="pPhotoIn" type="file" accept="image/*" hidden>
    <input id="pName" maxlength="30" placeholder="الاسم">
    <input id="pUserIn" dir="ltr" maxlength="20" placeholder="username">
    <div id="linked"></div>
    <textarea id="pBio" maxlength="120" rows="2" placeholder="نبذة عنك"></textarea>
    <button id="pSave" class="btn">حفظ</button>
    <button id="pOut" class="btn dark">تسجيل الخروج</button>
    <button id="pClose" class="btn ghost">إغلاق</button>
  </div>
</div>
</body>
</html>
